name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate monorepo
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://mansa:mansa@localhost:5432/mansa?schema=public

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: mansa
          POSTGRES_USER: mansa
          POSTGRES_PASSWORD: mansa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mansa -d mansa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Validate product registry
        run: pnpm registry:check

      - name: Validate Prisma schema
        run: pnpm --filter @mansa/api-gateway prisma:validate

      - name: Generate Prisma client
        run: pnpm --filter @mansa/api-gateway prisma:generate

      - name: Apply database migrations
        run: pnpm --filter @mansa/api-gateway exec prisma migrate deploy

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Reconciliation PostgreSQL integration
        run: pnpm --filter @mansa/api-gateway test:postgres

      - name: Build
        run: pnpm build
